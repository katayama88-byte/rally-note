<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><meta name="theme-color" content="#FFFFFF"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="RALLY NOTE"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="format-detection" content="telephone=no"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><title>RALLY NOTE</title></head><body>
<title>RALLY NOTE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titan+One&family=Rubik:wght@500;600;700;800;900&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap">
<style>
/* Layout: "SCOREBOARD" white (案C白, V29; mobile hardening V33; standalone web V34; name/team suggestions V35; 21-point option V36; 21pt cap 30 V37; wordmark fits CTA width V38; club byline V39; byline pink V40; 2-game format + rule order V41; prepare matches before play V42; POP poster redesign + bouncing title V43; rally line removed V44; byline team name in ink V45; sticker deeper pink + white text V46; title period in logo pink V47; centred plus icon V48; calmer MATCHES heading V49) — white ground, flat light-grey cards, rounded-rect controls; bright teal (A / primary) and bright pink (B) from the club logo; score mode = two deep-tinted panels with numbers in logo teal / deep pink. The printed sheet stays white paper. */
:root{
  --bg:#FFFFFF; --surface:#F1F6F6; --field:#FFFFFF; --ink:#142625; --muted:#5E7372; --line:#DCE7E6;
  --teal:#058687; --on-teal:#FFFFFF; --teal-tint:#DCEEEE; --teal-ink:#046A6B;
  --pink:#C2476A; --pink-dot:#DC6B88; --pink-tint:#FBE7ED; --pink-ink:#9E3B5A; --pink-soft:#F6C2D1;
  --court:var(--teal-tint); --rival:var(--pink-tint); --score-bg:#FFFFFF;
  --danger:#C2364E; --danger-fill:#B8314A; --focus:#058687;
  /* paper tokens: the printed sheet is always white paper */
  --paper:#FFFFFF; --paper-ink:#142625; --paper-muted:#5E7372; --paper-line:#CBD8D7; --paper-soft:#F0F6F6; --paper-court:#058687; --paper-rival:#C2557A;
  --font-ui:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  --font-num:"Rubik","Avenir Next","Helvetica Neue",sans-serif;
  --font-disp:"Titan One","Rubik","Arial Black",sans-serif;
  --r:24px; --r-sm:16px; --r-btn:18px;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);font-size:16px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
/* --- mobile hardening (V33): no sideways drift, no bounce, no accidental zoom --- */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-x:hidden;overflow-x:clip;overscroll-behavior:none;touch-action:manipulation}
body{overflow-x:hidden;overflow-x:clip;overscroll-behavior:none;overflow-wrap:break-word;width:100%;max-width:100%;position:relative}
html.lock,html.lock body{overflow:hidden;overscroll-behavior:none}
button,a,label,.side{-webkit-touch-callout:none}
button,label,.seg,.chip,.eyebrow,.en{-webkit-user-select:none;user-select:none}
.btn:active,.ibtn:active,.undo:active,.seg label:active,.sug-pick:active{filter:brightness(.95)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.app{max-width:720px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:16px 56px;box-sizing:border-box;width:100%;min-width:0;display:flex;flex-direction:column;gap:20px}
.app>section{display:flex;flex-direction:column;gap:20px;min-width:0}
.eyebrow{font-family:var(--font-disp);font-weight:900;font-synthesis:none;letter-spacing:.05em;text-transform:uppercase;font-size:15px;line-height:1.2;color:var(--pink);margin:0}
h2.sec{white-space:nowrap;font-size:14px;font-weight:700;margin:0;color:var(--muted);display:flex;align-items:baseline;gap:10px}
h2.sec .en{font-family:var(--font-num);font-weight:800;font-size:15px;letter-spacing:.14em;color:var(--ink)}
.en{font-family:var(--font-disp);font-weight:900;font-synthesis:none;font-size:13px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase}
.fine{font-size:13px;color:var(--muted);margin:0;line-height:1.7}

/* hero */
.hero{display:flex;flex-direction:column;gap:8px;padding:4px 0 0;min-width:0}
.poster{--stk:clamp(86px,26vw,132px);position:relative;background:var(--teal);color:#FFFFFF;border-radius:28px;padding:16px 18px 20px;overflow:hidden;min-width:0;isolation:isolate}
.poster-top{position:relative;z-index:3;min-height:calc(var(--stk) - 18px);margin:0;padding-right:calc(var(--stk) + 4px);font-family:var(--font-num);font-weight:800;font-size:11px;line-height:1.35;letter-spacing:.14em;text-transform:uppercase;color:#FFFFFF}
.sticker{position:absolute;z-index:4;top:10px;right:10px;width:var(--stk);height:var(--stk);transform:rotate(-12deg);color:#FFFFFF}
.sticker svg{display:block;width:100%;height:100%;overflow:visible}
.sticker .bg{fill:var(--pink-dot)}
.sticker text{font-family:var(--font-num);font-weight:800;font-size:7.6px;letter-spacing:.08em;fill:#FFFFFF}
.sticker .mid{font-family:var(--font-disp);font-weight:900;font-synthesis:none;font-size:15px;letter-spacing:.03em}
.wordmark{position:relative;z-index:2;font-family:var(--font-disp);font-weight:900;font-synthesis:none;font-size:clamp(56px,22vw,150px);line-height:.88;letter-spacing:.01em;margin:6px 0 0;color:#FFFFFF;display:flex;flex-direction:column;align-items:flex-start;white-space:nowrap}
.wordmark .ln{display:block;width:max-content;position:relative}
.wordmark .ln:first-child{z-index:2}
.wordmark .ch{display:inline-block;transform-origin:50% 100%}
.wordmark .pd{color:var(--pink-dot)}
.wordmark .dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;margin:0 .04em;background:linear-gradient(var(--pink-dot) 0 46%,transparent 46% 54%,#FFFFFF 54% 100%)}
.byline{margin:0;align-self:flex-end;font-family:var(--font-num);font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--muted);white-space:nowrap}
.byline b{font-weight:800;color:var(--ink)}
/* opening animation (V43): letters drop in and bounce, then the sticker pops */
.hero.intro .wordmark .ch,.hero.intro .sticker{opacity:0}
.hero.play .wordmark .ch{animation:rn-drop 1s both;animation-delay:calc(var(--i) * 65ms)}
.hero.play .sticker{animation:rn-pop .55s cubic-bezier(.34,1.56,.64,1) both;animation-delay:.95s}
@keyframes rn-drop{
  0%{opacity:0;transform:translateY(-95%) scale(.92,1.12);animation-timing-function:cubic-bezier(.55,0,1,.45)}
  14%{opacity:1}
  40%{transform:translateY(0) scale(1.2,.76);animation-timing-function:cubic-bezier(0,.55,.45,1)}
  56%{transform:translateY(-24%) scale(.95,1.07);animation-timing-function:cubic-bezier(.55,0,1,.45)}
  70%{transform:translateY(0) scale(1.09,.9);animation-timing-function:cubic-bezier(0,.55,.45,1)}
  82%{transform:translateY(-7%) scale(.99,1.02);animation-timing-function:cubic-bezier(.55,0,1,.45)}
  92%{transform:translateY(0) scale(1.02,.98)}
  100%{opacity:1;transform:none}
}
@keyframes rn-pop{0%{opacity:0;transform:rotate(-70deg) scale(0)}100%{opacity:1;transform:rotate(-12deg) scale(1)}}

/* buttons */
.cta{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;border:0;border-radius:var(--r);background:var(--teal);color:var(--on-teal);font-size:18px;font-weight:900;letter-spacing:.04em}
.cta:active,.btn:active{transform:translateY(2px)}
.cta.ink{background:var(--ink);min-height:68px;font-size:19px}
.cta .plus{flex:none;width:36px;height:36px;border-radius:50%;background:var(--pink-dot);color:#FFFFFF;display:grid;place-items:center}
.cta .plus svg{display:block;width:16px;height:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:56px;border:0;border-radius:var(--r-btn);background:var(--surface);font-size:16px;font-weight:700;color:var(--ink)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.link-danger{background:none;border:0;color:var(--danger);font-weight:700;font-size:15px;padding:12px;align-self:center}
.back{align-self:flex-start;background:var(--surface);border:0;border-radius:99px;font-size:14px;font-weight:700;padding:8px 16px;color:var(--ink)}
button[disabled]{opacity:.5;cursor:default}

/* list */
.sec-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 12px;margin-top:4px;padding:0 4px}
.swipe-hint{font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.item{width:100%;display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border:0;border-radius:var(--r);padding:16px;color:var(--ink)}
.item .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.item .dt{font-family:var(--font-num);font-weight:800;font-size:12px;letter-spacing:.1em;color:#FFFFFF;background:var(--ink);border-radius:99px;padding:3px 11px;line-height:1.5}
.item .t{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:2px}
.item .names{display:flex;flex-direction:column;font-weight:900;font-size:16px;line-height:1.4;min-width:0;overflow-wrap:anywhere}
.item .names .b{color:var(--muted);font-weight:500}
.item .names>span{display:flex;align-items:baseline;min-width:0}
.item .names .nx{flex:0 0 auto;max-width:100%;overflow-wrap:anywhere}
.item .names .tm{flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;font-weight:500;margin-left:.6em;letter-spacing:.02em}
.item .names .a .tm{color:var(--teal-ink)} .item .names .b .tm{color:var(--pink-ink)}
.item .scs{flex:none;display:flex;gap:10px;font-family:var(--font-num);font-weight:800;font-size:19px;line-height:1.25;text-align:center;font-variant-numeric:tabular-nums}
.item .scs.big{font-size:26px}
.item .scs>span{display:flex;flex-direction:column;min-width:1.4em}
.item .scs i{font-style:normal;color:var(--muted)}
.item .scs i.wa{color:var(--teal)} .item .scs i.wb{color:var(--pink)}
.chip{font-size:12px;font-weight:700;white-space:nowrap;color:var(--muted);display:inline-flex;align-items:center;gap:6px;background:var(--field);border-radius:99px;padding:3px 11px;line-height:1.5}
.chip.live{color:#FFFFFF;background:var(--pink)}
.chip.live::before{content:"";width:7px;height:7px;border-radius:50%;background:#FFFFFF}
.chip.ready{color:var(--teal-ink);background:var(--teal-tint)}
.chip.ready::before{content:"";width:6px;height:6px;border-radius:50%;border:2px solid var(--teal)}
.item .go{flex:none;font-size:13px;font-weight:900;color:#FFFFFF;background:var(--teal);border-radius:99px;padding:6px 13px;white-space:nowrap}
.empty{background:var(--surface);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}

/* swipe to delete (home list) */
li.swipe{position:relative;border-radius:var(--r);overflow:hidden}
li.swipe .swipe-act{position:absolute;top:0;right:0;bottom:0;width:100%;display:flex;justify-content:flex-end;background:var(--danger-fill);visibility:hidden}
li.swipe.off .swipe-act{visibility:visible}
.swipe-del{width:96px;border:0;background:none;color:#fff;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
li.swipe .item{position:relative;touch-action:pan-y;transition:transform .22s ease-out;will-change:transform}
li.swipe.drag .item{transition:none}
li.swipe.gone{transition:height .22s ease-out,opacity .22s;opacity:0}

/* form */
form{display:flex;flex-direction:column;gap:12px}
fieldset{border:0;margin:0;padding:18px 16px;display:flex;flex-direction:column;gap:14px;min-width:0;background:var(--surface);border-radius:var(--r)}
legend{float:left;width:100%;font-size:16px;font-weight:900;margin:0;padding:0;letter-spacing:.04em;display:flex;flex-direction:column;gap:0}
legend .en{color:var(--ink)} legend .en.a{color:var(--teal-ink)} legend .en.b{color:var(--pink-ink)}
fieldset.player.a{background:var(--teal-tint)} fieldset.player.b{background:var(--pink-tint)}
legend+*{clear:both}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.lbl{font-size:13px;font-weight:700;color:var(--muted)}
.field input:not([type=radio]),.field select,.field textarea{-webkit-appearance:none;appearance:none;min-height:52px;border:1.5px solid transparent;border-radius:var(--r-sm);background:var(--field);padding:10px 14px;font-size:17px;width:100%;min-width:0;box-sizing:border-box}
.field input::placeholder,.field textarea::placeholder{color:#8A9C9B}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--teal)}
.field textarea{min-height:84px;resize:vertical}
.field input[type=date],.field input[type=time]{display:block;max-width:100%;text-align:left;line-height:30px}
.field input::-webkit-date-and-time-value{text-align:left;margin:0}
.field input[type=number],.step input{-moz-appearance:textfield;appearance:textfield}
.field input::-webkit-inner-spin-button,.field input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button,.step input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.seg{position:relative;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:8px;min-width:0}
.seg input{position:absolute;left:0;top:0;width:1px;height:1px;min-height:0;margin:0;padding:0;border:0;opacity:0;pointer-events:none;overflow:hidden}
.seg label{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:52px;border-radius:var(--r-btn);border:2px solid transparent;background:var(--field);font-size:16px;font-weight:700;color:var(--ink);text-align:center;line-height:1.25;padding:6px 8px;box-sizing:border-box}
.seg label small{font-size:12px;font-weight:500;margin-top:2px;color:var(--muted)}
.seg input:checked+label{background:var(--teal);border-color:var(--teal);color:#FFFFFF}
.seg input:checked+label small{color:#FFFFFF;opacity:.88}
.seg input:focus-visible+label{outline:3px solid var(--focus);outline-offset:2px}
.seg input:disabled+label{opacity:.5}
.seg.v{grid-auto-flow:row}
.badge{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-family:var(--font-disp);font-weight:900;font-synthesis:none;font-size:16px;color:#FFFFFF;flex:none}
.badge.a{background:var(--teal)} .badge.b{background:var(--pink-dot)}
form[data-type="S"] .only-d{display:none}
details{background:var(--surface);border:0;border-radius:var(--r);padding:2px 16px}
details summary{font-weight:700;padding:14px 0;cursor:pointer}
details[open]{padding-bottom:16px}
details .inner{display:flex;flex-direction:column;gap:14px}
form>.cta{margin-top:8px}

/* score mode */
.score{position:fixed;inset:0;background:var(--score-bg);display:flex;flex-direction:column;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 12px) calc(env(safe-area-inset-bottom,0px) + 12px) calc(env(safe-area-inset-left,0px) + 12px);z-index:10;box-sizing:border-box;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.sbar{display:flex;align-items:center;gap:6px;min-width:0}
.ibtn{flex:none;min-width:46px;height:46px;border-radius:var(--r-sm);border:0;background:var(--surface);font-size:15px;font-weight:700;padding:0 11px;white-space:nowrap;color:var(--ink)}
.stitle{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1.25}
.stitle strong{font-family:var(--font-disp);font-weight:900;font-synthesis:none;font-size:20px;letter-spacing:.05em;color:var(--ink);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.stitle span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.gbar{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;text-align:center;font-family:var(--font-num);font-weight:800;font-size:13px;letter-spacing:.14em}
.gbar span{background:var(--surface);border-radius:99px;padding:6px 0}
.gbar .a{color:var(--teal-ink);background:var(--teal-tint)} .gbar .b{color:var(--pink-ink);background:var(--pink-tint)}
.gbar.swapped .a{order:2}
.court{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:10px}
.court.swapped .side.a{order:2}
.side{position:relative;border:0;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:20px 10px;min-width:0;min-height:0;overflow:hidden;user-select:none;-webkit-user-select:none;color:var(--ink);container-type:size}
.side.a{background:var(--teal);color:#FFFFFF}
.side.b{background:var(--pink);color:#FFFFFF}
.side.hit{animation:hit .22s ease-out}
@keyframes hit{0%{transform:scale(.97)}100%{transform:scale(1)}}
.side.hit .pts{animation:bump .32s cubic-bezier(.34,1.56,.64,1)}
@keyframes bump{0%{transform:translateY(6%) scale(1.14,.86)}100%{transform:none}}
.side .who{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px;min-width:0;max-width:100%}
.side .nm{font-size:18px;font-weight:900;line-height:1.3;overflow-wrap:anywhere}
.side .tm{font-size:12px}
.side .tm,.side .tap-hint{color:#FFFFFF;opacity:.88}
.side .pts{font-family:var(--font-num);font-weight:800;font-size:clamp(100px,34vw,280px);font-size:clamp(56px,min(70cqw,52cqh),280px);line-height:.88;font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.side .pts{color:#FFFFFF}
.side .ft{display:flex;flex-direction:column;align-items:center;gap:8px}
.srv{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:900;padding:6px 14px;border-radius:99px;background:#FFFFFF;color:var(--teal-ink);visibility:hidden}
.side.b .srv{color:var(--pink-ink)}
.srv.on{visibility:visible}
.tap-hint{font-size:12px}
.sfoot{display:flex;align-items:stretch;gap:10px}
.undo{flex:1;min-height:56px;border-radius:var(--r-btn);border:0;background:var(--surface);font-size:17px;font-weight:700;color:var(--ink)}
.hist{display:flex;flex-direction:column;justify-content:center;gap:0;font-family:var(--font-num);font-size:15px;font-weight:700;color:var(--muted);line-height:1.3;background:var(--surface);border-radius:var(--r-sm);padding:4px 14px;white-space:nowrap}
.hist:empty{display:none}
.gate{position:absolute;inset:0;background:rgba(255,255,255,.9);background:color-mix(in srgb,var(--score-bg) 86%,transparent);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 20px) 20px calc(env(safe-area-inset-bottom,0px) + 20px);z-index:2;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;box-sizing:border-box}
.gate-card{margin:auto;background:var(--surface);border:0;border-radius:28px;padding:26px 22px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:14px;text-align:center}
.gate-card .eyebrow{font-size:22px}
.gate-card .big{font-family:var(--font-num);font-weight:800;font-size:72px;line-height:1;margin:0;font-variant-numeric:tabular-nums;color:var(--ink)}
.gate-card p{margin:0}
.gate-card .who-won{font-weight:700;font-size:18px}
.gate-card .btn{background:var(--field)}

/* sheet preview */
.frame{width:100%;max-width:100%;overflow:hidden;contain:paint;border-radius:16px;background:var(--paper)}
.scaler{width:794px;transform-origin:0 0}
.confirm{background:var(--surface);border:1.5px solid var(--danger);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;text-align:center}
.confirm .btn{background:var(--field)}

/* the printable sheet (A4 @ 96dpi) */
.sheet{overflow-wrap:break-word;width:794px;min-height:1123px;box-sizing:border-box;padding:44px 40px 36px;background:var(--paper);color:var(--paper-ink);font-family:var(--font-ui);font-size:13px;line-height:1.5;display:flex;flex-direction:column;gap:18px}
.sheet .hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--paper-ink);padding-bottom:12px;gap:20px}
.sheet .hd .k{font-family:var(--font-num);font-weight:600;letter-spacing:.2em;font-size:12px;color:var(--paper-muted)}
.sheet .hd h1{margin:2px 0 0;font-size:24px;font-weight:900;line-height:1.3}
.sheet .mark{font-family:var(--font-disp);font-weight:900;font-synthesis:none;font-size:20px;letter-spacing:.03em;color:var(--paper-court);white-space:nowrap}
.sheet table{border-collapse:collapse;width:100%}
.sheet .meta{table-layout:fixed}
.sheet .meta td{border:1px solid var(--paper-line);padding:6px 10px;vertical-align:top}
.sheet .meta .l{display:block;font-size:10px;font-weight:700;color:var(--paper-muted);letter-spacing:.08em}
.sheet .meta .v{font-size:14px;font-weight:700;min-height:21px;display:block}
.sheet .vs{display:grid;grid-template-columns:1fr 70px 1fr;align-items:stretch;gap:0;border:1px solid var(--paper-line)}
.sheet .pl{padding:14px 16px;display:flex;flex-direction:column;gap:4px;position:relative}
.sheet .pl.b{text-align:right}
.sheet .pl .tag{font-family:var(--font-num);font-weight:700;font-size:13px;letter-spacing:.12em}
.sheet .pl.a .tag{color:var(--paper-court)} .sheet .pl.b .tag{color:var(--paper-rival)}
.sheet .pl .n{font-size:18px;font-weight:900;line-height:1.35}
.sheet .pl .t{font-size:12px;color:var(--paper-muted)}
.sheet .pl .won{font-family:var(--font-num);font-weight:700;font-size:12px;letter-spacing:.14em;color:#fff;padding:2px 10px;border-radius:99px;align-self:flex-start}
.sheet .pl.b .won{align-self:flex-end}
.sheet .pl.a .won{background:var(--paper-court)} .sheet .pl.b .won{background:var(--paper-rival)}
.sheet .mid{display:flex;align-items:center;justify-content:center;font-family:var(--font-num);font-weight:600;font-size:32px;background:var(--paper-soft);border-inline:1px solid var(--paper-line);font-variant-numeric:tabular-nums}
.sheet .res th,.sheet .res td{border:1px solid var(--paper-line);padding:6px 8px;text-align:center}
.sheet .res th{font-size:11px;font-weight:700;color:var(--paper-muted);background:var(--paper-soft)}
.sheet .res td{font-family:var(--font-num);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.sheet .res td.nm{font-family:var(--font-ui);font-size:13px;font-weight:700;text-align:left;width:34%}
.sheet .res td.w{background:var(--paper-soft);font-weight:700}
.sheet .gm{display:flex;flex-direction:column;gap:6px}
.sheet .gm .gt{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--paper-muted)}
.sheet .gm .gt b{color:var(--paper-ink);font-size:13px}
.sheet .strip td{border:1px solid var(--paper-line);width:22px;height:21px;padding:0;text-align:center;font-family:var(--font-num);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.sheet .strip td.s{width:28px;font-size:11px;font-weight:700;letter-spacing:.06em;background:var(--paper-soft)}
.sheet .strip tr.ra td.on{color:var(--paper-court)} .sheet .strip tr.rb td.on{color:var(--paper-rival)}
.sheet .strip td.sr{color:var(--paper-ink);font-weight:700;background:var(--paper-soft)}
.sheet .strip{margin-bottom:4px;table-layout:fixed;width:auto}
.sheet .note{border:1px solid var(--paper-line);padding:8px 12px;min-height:44px;white-space:pre-wrap}
.sheet .note .l{display:block;font-size:10px;font-weight:700;color:var(--paper-muted);letter-spacing:.08em}
.sheet .stamp{white-space:nowrap;flex:none;border:2px solid var(--paper-rival);color:var(--paper-rival);font-weight:900;padding:2px 10px;border-radius:99px;font-size:12px}
.sheet .foot{margin-top:auto;display:flex;justify-content:space-between;font-size:11px;color:var(--paper-muted);border-top:1px solid var(--paper-line);padding-top:8px}
.sheet .legend{font-size:11px;color:var(--paper-muted)}

/* rules + point editor */
form:not([data-pmode="free"]) .only-free{display:none}
form:not([data-deuce="1"]) .only-deuce{display:none}
form[data-mode="result"] .only-rally{display:none}
form:not([data-mode="result"]) .only-result{display:none}
.btn small{font-weight:500;color:var(--muted);font-size:13px}
a.btn{text-decoration:none;color:var(--ink);box-sizing:border-box}
.topnav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:0 8px}
.back.info{color:var(--teal-ink);background:var(--teal-tint)}
.sug{display:flex;flex-direction:column;border-radius:var(--r-sm);background:var(--field);overflow:hidden}
.sug-h{font-size:12px;font-weight:700;color:var(--muted);padding:8px 14px 4px}
.sug-row{display:flex;border-top:1px solid var(--line)}
.sug-pick{flex:1;min-width:0;display:flex;align-items:center;gap:8px;text-align:left;min-height:48px;padding:10px 14px;border:0;background:none;font-size:16px;font-weight:500;overflow-wrap:anywhere;color:var(--ink)}
.sug-pick svg{flex:none;color:var(--teal)}
.sug-del{flex:none;width:52px;border:0;border-left:1px solid var(--line);background:none;color:var(--muted);font-size:22px;line-height:1}
.ecard{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.ecard h3{margin:0;font-size:16px;font-weight:900;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ecard .chip.done{color:var(--teal)}
.erow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px}
.erow .who{display:flex;align-items:center;gap:8px;min-width:0;font-weight:700;overflow-wrap:anywhere}
.step{display:grid;grid-template-columns:50px 72px 50px;gap:6px}
.step button{height:50px;border-radius:var(--r-sm);border:0;background:var(--field);font-size:24px;font-weight:700;line-height:1;color:var(--ink)}
.step input{height:50px;border-radius:var(--r-sm);border:1.5px solid transparent;background:var(--field);text-align:center;font-family:var(--font-num);font-size:26px;font-weight:700;width:100%;box-sizing:border-box;font-variant-numeric:tabular-nums}
.step input:focus{outline:none;border-color:var(--teal)}
.ecard .note{font-size:13px;color:var(--muted);margin:0}
.mini{background:none;border:0;color:var(--danger);font-size:13px;font-weight:700;padding:6px}
.frame .res td[data-act]{cursor:pointer;box-shadow:inset 0 -3px 0 var(--paper-line)}
@media (hover:hover){.frame .res td[data-act]:hover{background:var(--paper-soft)}}
.cell-head{display:flex;align-items:center;gap:10px;font-weight:900;font-size:18px;overflow-wrap:anywhere}
.step.lg{grid-template-columns:72px minmax(0,1fr) 72px;align-self:stretch}
.step.lg button,.step.lg input{height:72px;font-size:32px}
.end-list{display:flex;flex-direction:column;gap:10px}
#capture{position:absolute;left:-12000px;top:0;width:794px;pointer-events:none}
#toast{box-sizing:border-box;width:max-content;position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:99px;font-weight:700;font-size:15px;z-index:50;max-width:calc(100% - 32px);text-align:center;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
#toast.has-act.show{pointer-events:auto;display:flex;align-items:center;gap:14px;padding:8px 8px 8px 20px;white-space:nowrap}
#toast .t-act{border:0;border-radius:99px;background:var(--teal);color:#FFFFFF;font-weight:700;font-size:15px;padding:8px 16px;min-height:40px}
.modal{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 88%,transparent);z-index:40;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);box-sizing:border-box}
.modal .box{max-width:620px;margin:0 auto;background:var(--surface);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.modal .box .btn{background:var(--field)}
.modal img{width:100%;border:1px solid var(--line);border-radius:8px}
/* small phones (iPhone SE etc.) */
@media (max-width:360px){
  .ibtn{min-width:42px;padding:0 8px;font-size:14px}
  .stitle strong{font-size:15px;letter-spacing:.1em}
  .step{grid-template-columns:44px 60px 44px}
  .step button,.step input{height:46px}
  .seg label{font-size:15px;padding:6px 4px}
  .erow{grid-template-columns:auto minmax(0,1fr);row-gap:8px}
  .erow .step{grid-column:1/-1;grid-template-columns:56px minmax(0,1fr) 56px}
}
/* phone held sideways: keep the whole score screen on one screen */
@media (orientation:landscape) and (max-height:500px){
  .score{gap:8px;padding-top:calc(env(safe-area-inset-top,0px) + 6px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 8px)}
  .ibtn{height:40px}
  .gbar span{padding:3px 0}
  .side{padding:10px;border-radius:18px}
  .tap-hint{display:none}
  .undo{min-height:46px}
  .gate-card{padding:18px;gap:10px}
  .gate-card .big{font-size:48px}
  .gate-card .eyebrow{font-size:18px}
}
.inapp{background:var(--pink-tint);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:1.6;color:var(--ink)}
.inapp b{color:var(--pink-ink);font-size:14px}
@media (prefers-reduced-motion: reduce){.side.hit,.side.hit .pts{animation:none}#toast{transition:none}li.swipe .item,li.swipe.gone{transition:none}}
</style>

<script>
(function(){
"use strict";
var KEY = "rallynote.v1";
var WD = ["日","月","火","水","木","金","土"];
var WE = ["SUN","MON","TUE","WED","THU","FRI","SAT"];
var $ = function(s){ return document.querySelector(s); };

/* ---------- storage (this device only) ---------- */
function load(){ try { return JSON.parse(localStorage.getItem(KEY) || "null"); } catch(e){ return null; } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e){} }
var db = load() || { matches: [] };
if (!db.matches) db.matches = [];
if (!db.hiddenVenues) db.hiddenVenues = []; /* 候補から外した会場名 */
if (!db.hiddenTours) db.hiddenTours = []; /* 候補から外した大会名 */
if (!db.hiddenNames) db.hiddenNames = []; /* 候補から外した選手名（A・B共通） */
if (!db.hiddenTeams) db.hiddenTeams = []; /* 候補から外したチーム名（A・B共通） */
if (!db.seeded && !db.matches.length){ db.matches.push(sampleMatch()); db.seeded = true; save(); }
db.matches.forEach(function(m){ /* older records: fill in new rule fields */
  if (m.meta.deuce === undefined){ m.meta.deuce = true; m.meta.cap = m.meta.points === 21 ? 30 : null; }
});

var sugTouch = 0;
var view = "home", curId = null, editingId = null, confirmDel = false, wake = null, endAsk = false, presetMode = null;
function isResult(m){ return !!(m && m.mode === "result"); }
function isReady(m){ return !!(m && m.status === "ready"); } /* 試合前（情報だけ入力して準備した試合） */
function openView(m){ return m.status==="ready" ? "setup" : (m.status==="done" ? "sheet" : (isResult(m) ? "edit" : "score")); }

/* ---------- helpers ---------- */
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function pad(n){ return String(n).padStart(2,"0"); }
function todayStr(d){ d = d || new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function timeStr(d){ d = d || new Date(); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function fmtDateJP(s){ if(!s) return "—"; var p = s.split("-"); var d = new Date(+p[0], +p[1]-1, +p[2]); if (isNaN(d)) return s; return p[0]+"年"+(+p[1])+"月"+(+p[2])+"日（"+WD[d.getDay()]+"）"; }
/* 大会名が空欄なら日付、日付も空欄なら fb を出す */
function titleOf(M, fb){ return M.tournament || (M.date ? fmtDateJP(M.date) : fb); }
function uid(){ return "m" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function cur(){ for (var i=0;i<db.matches.length;i++) if (db.matches[i].id === curId) return db.matches[i]; return null; }
function find(id){ for (var i=0;i<db.matches.length;i++) if (db.matches[i].id === id) return db.matches[i]; return null; }

/* ---------- scoring rules ---------- */
function tally(g){ var a=0,b=0; g.rallies.forEach(function(r){ if (r==="A") a++; else b++; }); return {a:a,b:b}; }
function gameOver(m,g){
  var M=m.meta, t=tally(g), hi=Math.max(t.a,t.b), lo=Math.min(t.a,t.b);
  if (hi < M.points) return false;
  if (!M.deuce) return true;                 /* 延長なし：先に規定点 */
  if (M.cap && hi >= M.cap) return true;     /* 延長あり＋上限点 */
  return hi - lo >= 2;                       /* 延長あり：2点差 */
}
function ruleLabel(M){
  return M.points+"点・"+(M.deuce ? "延長あり"+(M.cap ? "（上限"+M.cap+"点）" : "（上限なし）") : "延長なし")+"・"+M.games+"ゲーム";
}
function gameWinner(m,g){ if(!gameOver(m,g)) return null; var t=tally(g); return t.a>t.b ? "A" : "B"; }
function wins(m){ var w={A:0,B:0}; m.games.forEach(function(g){ var x=gameWinner(m,g); if(x) w[x]++; }); return w; }
function ivPoint(m){ return m.meta.points===21 ? 11 : (m.meta.points===15 ? 8 : 0); }
function need(m){ return Math.ceil(m.meta.games/2); }
function matchWinner(m){
  if (m.result && m.result.type !== "normal") return m.result.winner || null;
  var w=wins(m);
  if (m.meta.games === 2){ /* 2ゲーム制：2ゲームとも行い、2-0なら勝ち、1-1は引き分け */
    if (!twoDone(m)) return null; return w.A>w.B ? "A" : (w.B>w.A ? "B" : null);
  }
  var n=need(m); return w.A>=n ? "A" : (w.B>=n ? "B" : null);
}
function twoDone(m){ return m.games.length >= 2 && gameOver(m, m.games[0]) && gameOver(m, m.games[1]); }
/* 試合が終わったか（2ゲーム制の引き分けも「終わり」） */
function matchOver(m){ if (m.result && m.result.type !== "normal") return true; return m.meta.games === 2 ? twoDone(m) : !!matchWinner(m); }
function isDraw(m){ return (!m.result || m.result.type === "normal") && m.meta.games === 2 && twoDone(m) && !matchWinner(m); }
function server(g){ return g.rallies.length ? g.rallies[g.rallies.length-1] : g.first; }
function lastGame(m){ return m.games[m.games.length-1]; }

function sideName(m,s){
  var p = m.meta[s==="A"?"a":"b"], n = p.names.filter(function(x){ return x && x.trim(); });
  if (m.meta.type === "D") return n.length ? n.join("・") : (s==="A"?"ペアA":"ペアB");
  return n[0] || (s==="A"?"選手A":"選手B");
}
function scoreLine(m){
  return m.games.filter(function(g){ return g.rallies.length; }).map(function(g){ var t=tally(g); return t.a+"-"+t.b; }).join("  ");
}

/* ---------- sample ---------- */
function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rallies(a,b,r){ var w = a>b ? "A" : "B", arr=[], i; for(i=0;i<(w==="A"?a-1:a);i++) arr.push("A"); for(i=0;i<(w==="B"?b-1:b);i++) arr.push("B"); for(i=arr.length-1;i>0;i--){ var j=Math.floor(r()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; } arr.push(w); return arr; }
function sampleMatch(){
  var r = rng(1013), d = new Date(Date.now() - 2*86400000); d.setHours(10,30,0,0);
  var t0 = d.getTime(), spec=[[21,17],[19,21],[21,14]], first="A", games=[], t=t0+120000;
  spec.forEach(function(s){ var g={ rallies: rallies(s[0],s[1],r), first:first, start:t, end:t + (14+Math.round(r()*6))*60000 }; games.push(g); t = g.end + 120000; first = s[0]>s[1] ? "A" : "B"; });
  return { id:"sample", sample:true, created:t0, status:"done", startedAt:games[0].start, endedAt:games[2].end, swapped:false,
    meta:{ tournament:"（サンプル）秋季ジュニアバドミントン大会", date:todayStr(d), time:"10:30", venue:"市総合体育館", court:"3", round:"2回戦", category:"小学4年以下 女子",
      type:"S", a:{names:["山田 ひかり",""],team:"みなとジュニア"}, b:{names:["佐藤 みのり",""],team:"あおばクラブ"}, points:21, deuce:true, cap:30, games:3, recorder:"", note:"" },
    result:{type:"normal"},
    games:games };
}

/* ---------- icons ---------- */
var TROPHY = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 6H4v1a3 3 0 0 0 3 3M17 6h3v1a3 3 0 0 1-3 3M12 14v4M8 21h8M9 18h6"/></svg>';

  '<text class="mid" x="50" y="48.5" text-anchor="middle">SCORE</text><text class="mid" x="50" y="63" text-anchor="middle">SHEET</text></svg></div>';
function wordmarkHTML(){
  var i = 0;
  function ch(c, cls){ return '<span class="ch'+(cls?" "+cls:"")+'" style="--i:'+(i++)+'">'+c+'</span>'; }
  var l1 = "RALLY".split("").map(function(c){ return ch(c); }).join("");

}
var COURT = '<svg class="lines" viewBox="0 0 670 305" preserveAspectRatio="xMidYMid slice" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3">'+

function point(s){
  var m = cur(), g = lastGame(m); if (gameOver(m,g)) return;
  var now = Date.now(); if (!g.start) g.start = now; if (!m.startedAt) m.startedAt = now;
  g.rallies.push(s);
  var t = tally(g), mine = s==="A" ? t.a : t.b, other = s==="A" ? t.b : t.a;
  if (gameOver(m,g)){ g.end = now; if (matchOver(m)) m.endedAt = now; }
  else if (ivPoint(m) && mine===ivPoint(m) && other<ivPoint(m)){ /* インターバル：21点制は11点、15点制は8点 */
    toast(ivPoint(m)+"点：インターバル"+(m.meta.games===3 && m.games.length===3 ? "・チェンジエンズ" : ""));
  } else if (m.meta.deuce && t.a===t.b && t.a===m.meta.points-1){
    toast((m.meta.points-1)+"オール：延長（2点差まで"+(m.meta.cap?"・上限"+m.meta.cap+"点":"")+"）");
  }
  try { if (navigator.vibrate) navigator.vibrate(12); } catch(e){}
  save(); renderScore();
  var el = document.querySelector('.side[data-side="'+s+'"]'); if (el){ el.classList.add("hit"); }
}
function undo(){
  var m = cur(), g = lastGame(m);
  if (m.status==="done") m.status = "playing";
  if (!g.rallies.length && m.games.length>1){ m.games.pop(); g = lastGame(m); }
  if (!g.rallies.length){ toast("戻せる点数がありません"); return; }
  g.rallies.pop(); g.end = null; m.endedAt = null;
  if (!g.rallies.length) g.start = null;
  if (m.games.length===1 && !g.rallies.length) m.startedAt = null;
  save(); renderScore();
}
function nextGame(){
  var m = cur(), g = lastGame(m), w = gameWinner(m,g); if (!w) return;
  m.games.push({ rallies:[], first:w, start:null, end:null }); save(); renderScore();
}

function fmtClock(ms){ return ms ? timeStr(new Date(ms)) : "—"; }
function cellTd(x){ return '<td'+(x==="S"||x==="R" ? ' class="sr"' : (x!=="" ? ' class="on"' : ""))+'>'+x+'</td>'; }
function strip(g){
  /* 最初の2マス：サーバー側に S・レシーバー側に R、続けて両者 0（実際のスコアシートの書き方） */
  var a=0,b=0,ra=[g.first==="A"?"S":"R","0"],rb=[g.first==="B"?"S":"R","0"];
  g.rallies.forEach(function(r){ if(r==="A"){ a++; ra.push(a); rb.push(""); } else { b++; rb.push(b); ra.push(""); } });
  var out="", per=30;
  for (var i=0;i<Math.max(ra.length,1);i+=per){
    var A=ra.slice(i,i+per), B=rb.slice(i,i+per);
    while (A.length<per){ A.push(""); B.push(""); }
    out += '<table class="strip"><tr class="ra"><td class="s">A</td>'+A.map(cellTd).join("")+'</tr>'+
           '<tr class="rb"><td class="s">B</td>'+B.map(cellTd).join("")+'</tr></table>';
  }
  return out;
}

  return '<div class="sheet">'+

function setPts(i,s,v,quiet){
  var m = cur(), g = m.games[i]; if (!g) return;
  v = Math.max(0, Math.min(99, parseInt(v,10) || 0));
  var t = tally(g), c = s==="A" ? t.a : t.b; if (v === c){ if (!quiet) render(); return; }
  while (c < v){ g.rallies.push(s); c++; }
  while (c > v){ g.rallies.splice(g.rallies.lastIndexOf(s), 1); c--; }
  g.edited = true; afterEdit(m, quiet);
}

/* ロゴ「RALLY / N●TE.」（2行）の文字サイズを、ポスター枠の内側の幅に合わせる（長い方の行がぴったり収まる。左の余白も差し引く） */
function fitWordmark(){
  var h = document.querySelector("#v-home .wordmark"); if (!h) return;
  var box = h.parentNode, bs = getComputedStyle(box);
  var target = box.clientWidth - parseFloat(bs.paddingLeft) - parseFloat(bs.paddingRight); if (!(target > 0)) return;
  h.style.fontSize = "100px"; h.style.marginLeft = "0";
  var w = 0; h.querySelectorAll(".ln").forEach(function(l){ w = Math.max(w, l.offsetWidth); });
  var cs = getComputedStyle(h), ls = parseFloat(cs.letterSpacing) || 0, bl = 0;
  try {
    var c = document.createElement("canvas").getContext("2d"); c.font = cs.fontWeight+" 100px "+cs.fontFamily;
    var mR = c.measureText("R"); if (typeof mR.actualBoundingBoxLeft === "number") bl = -mR.actualBoundingBoxLeft;
  } catch(e){}
  var k = target / Math.max(1, w - bl - ls);
  h.style.fontSize = (100*k).toFixed(2) + "px"; h.style.marginLeft = (-bl*k).toFixed(2) + "px";
}

}
window.addEventListener("orientationchange", function(){ setTimeout(function(){ if (view==="sheet") fitSheet(); }, 300); });
var sheetRO = window.ResizeObserver ? new ResizeObserver(function(){ if (view==="sheet") fitSheet(); }) : null;
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ if (view==="sheet") fitSheet(); if (view==="home") fitWordmark(); });

/* ---------- export ---------- */
var dlPromise = null;
function getDownloads(){
  if (!dlPromise) dlPromise = (window.claude && window.claude.use) ? window.claude.use("downloads").catch(function(){ return null; }) : Promise.resolve(null);
  return dlPromise;
}
getDownloads();
function fileBase(m){
  var M=m.meta, s=(M.date||todayStr())+"_"+(M.tournament ? M.tournament+"_" : "")+sideName(m,"A")+"-vs-"+sideName(m,"B");
  return s.replace(/[\\\/:*?"<>|]/g,"").replace(/\s+/g,"_").slice(0,90);
}
async function capture(m){
  var host = $("#capture"); host.innerHTML = sheetHTML(m);
  try { await document.fonts.ready; } catch(e){}
  var c = await window.html2canvas(host.firstElementChild, { scale:2, backgroundColor:"#ffffff", logging:false });
  host.innerHTML = ""; return c;
}
async function exportFile(kind){
  var m = cur(); if (!m) return;
  if (!window.html2canvas || (kind==="pdf" && !(window.jspdf && window.jspdf.jsPDF))){ toast("保存の準備ができていません。通信環境を確認して開き直してください"); return; }
  busy(true);
  var canvas;
  try {
    canvas = await capture(m);
    var blob, name = fileBase(m) + (kind==="pdf" ? ".pdf" : ".png");
    if (kind==="pdf"){
      var pdf = new window.jspdf.jsPDF({ orientation:"p", unit:"mm", format:"a4" });
      var pw=210, ph=297, w=pw, h=canvas.height*pw/canvas.width;
      if (h>ph){ h=ph; w=canvas.width*ph/canvas.height; }
      pdf.addImage(canvas.toDataURL("image/jpeg",0.95), "JPEG", (pw-w)/2, 0, w, h);
      blob = pdf.output("blob");
    } else {
      blob = await new Promise(function(r){ canvas.toBlob(r, "image/png"); });
    }
    var dl = await getDownloads();
    if (!dl){ await deviceSave(blob, name, kind, canvas); return; }
    try { await dl.save({ filename:name, data:blob }); toast("保存しました"); }
    catch(e){
      var c = e && e.code;
      if (c==="declined") toast("保存をキャンセルしました");
      else if (c==="rate_limited") toast("少し待ってから、もう一度押してください");
      else fallback(canvas);
    }
  } catch(e){ console.error(e); toast("ファイルを作れませんでした。もう一度お試しください"); }
  finally { busy(false); }
}
/* Claudeの外（普通のWebページ）で開いたとき：スマホは共有メニュー（LINE・ファイルに保存など）、パソコンは通常のダウンロード */
var pendingShare = null;
function canShareFile(f){ try { return !!(navigator.share && navigator.canShare && navigator.canShare({ files:[f] })); } catch(e){ return false; } }
async function shareFile(f){
  try { await navigator.share({ files:[f], title:f.name }); return "ok"; }
  catch(e){ if (e && e.name === "AbortError") return "cancel"; if (e && e.name === "NotAllowedError") return "again"; throw e; }
}
function downloadBlob(blob, name){
  try {
    var u = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = u; a.download = name; a.rel = "noopener"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(u); }, 60000); return true;
  } catch(e){ return false; }
}
async function deviceSave(blob, name, kind, canvas){
  var file = null;
  try { file = new File([blob], name, { type: kind==="pdf" ? "application/pdf" : "image/png" }); } catch(e){}
  var touch = window.matchMedia && window.matchMedia("(pointer:coarse)").matches;
  if (file && touch && canShareFile(file)){
    var r = "again";
    try { r = await shareFile(file); } catch(e){ console.error(e); r = "again"; }
    if (r === "ok"){ toast("共有・保存しました"); return; }
    if (r === "cancel"){ toast("キャンセルしました"); return; }
    readyModal(file, blob, name, canvas); return; /* シート作成に時間がかかると、もう一度タップが必要な端末がある */
  }
  if (downloadBlob(blob, name)){ toast("保存しました"); return; }
  fallback(canvas);
}
function readyModal(file, blob, name, canvas){
  pendingShare = { file:file, blob:blob, name:name, canvas:canvas };
  var md = $("#modal");
  md.innerHTML = '<div class="box" style="max-width:420px"><p class="eyebrow">Ready</p><b style="font-size:18px">スコアシートができました</b>'+
    '<p class="fine">下のボタンから、LINEで送る・ファイルに保存するなどを選べます。</p>'+
    '<button class="cta" data-act="share-now">共有・保存する</button>'+
    '<button class="btn" data-act="dl-now">ダウンロードする</button>'+
    '<button class="btn" data-act="img-now">画像を長押しで保存する</button>'+
    '<button class="btn" data-act="close-modal">閉じる</button></div>';
  md.hidden = false; lockScroll();
}
function fallback(canvas){
  var md = $("#modal");
  md.innerHTML = '<div class="box"><b style="font-size:18px">この画面ではファイル保存ができません</b>'+
    '<p class="fine">下の画像を長押し（パソコンは右クリック）して保存してください。</p>'+
    '<img alt="スコアシート" src="'+canvas.toDataURL("image/png")+'"><button class="cta" data-act="close-modal">閉じる</button></div>';
  md.hidden = false; lockScroll();
}
function busy(on){
  document.querySelectorAll('[data-act="pdf"],[data-act="png"]').forEach(function(b){ b.disabled = on; });
  if (on) toast("シートを作成しています…", 6000);
}

/* ---------- misc ---------- */
var tt=null;
function toast(msg, ms, actLabel, actFn){
  var t=$("#toast"); t.textContent=msg; t.classList.toggle("has-act", !!actLabel);
  if (actLabel){ var b=document.createElement("button"); b.type="button"; b.className="t-act"; b.textContent=actLabel;
    b.addEventListener("click", function(){ clearTimeout(tt); t.classList.remove("show"); actFn(); }); t.appendChild(b); }
  t.classList.add("show"); clearTimeout(tt); tt=setTimeout(function(){ t.classList.remove("show"); }, ms||2200);
}

/* ---------- swipe to delete (home list) ---------- */
var SW = 96, swOpen = null, sw = null, swSuppress = 0;
function swSet(li, x){ li.querySelector(".item").style.transform = x ? "translateX("+x+"px)" : ""; li.classList.toggle("off", x !== 0); }
function swClose(li){ if (!li) return; swSet(li, 0); if (swOpen === li) swOpen = null; }
document.addEventListener("pointerdown", function(e){
  if (view !== "home") return;
  if (swOpen && !e.target.closest(".swipe-del")){ /* 開いている行は、ほかの場所に触れたら閉じる */
    var wasOpen = e.target.closest("li.swipe") === swOpen; swClose(swOpen); if (wasOpen){ swSuppress = Date.now(); return; }
  }
  var it = e.target.closest("li.swipe .item"); if (!it || e.button > 0) return;
  var li = it.parentNode;
  sw = { li:li, id:e.pointerId, x0:e.clientX, y0:e.clientY, base: swOpen === li ? -SW : 0, drag:false };
});
document.addEventListener("pointermove", function(e){
  if (!sw || e.pointerId !== sw.id) return;
  var dx = e.clientX - sw.x0, dy = e.clientY - sw.y0;
  if (!sw.drag){
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){ sw = null; return; } /* 縦スクロール */
    if (Math.abs(dx) < 10) return;
    sw.drag = true; sw.li.classList.add("drag");
    try { sw.li.querySelector(".item").setPointerCapture(e.pointerId); } catch(_){}
  }
  var x = sw.base + dx; if (x > 0) x = 0; if (x < -SW) x = -SW + (x + SW) * 0.35; /* 引っぱりすぎは重く */
  swSet(sw.li, x);
});
function swEnd(e){
  if (!sw || e.pointerId !== sw.id) return;
  var s = sw; sw = null; if (!s.drag) return;
  s.li.classList.remove("drag"); swSuppress = Date.now();
  var m = s.li.querySelector(".item").style.transform.match(/-?[\d.]+/), x = m ? +m[0] : 0;
  if (x < -SW/2){ if (swOpen && swOpen !== s.li) swClose(swOpen); swSet(s.li, -SW); swOpen = s.li; } else swClose(s.li);
}
document.addEventListener("pointerup", swEnd);
document.addEventListener("pointercancel", swEnd);
document.addEventListener("click", function(e){ /* スワイプ直後のタップで試合が開かないように */
  if (Date.now() - swSuppress < 350 && e.target.closest("li.swipe .item")){ e.stopImmediatePropagation(); e.preventDefault(); }
}, true);
function swipeDelete(id){
  var idx = -1; db.matches.forEach(function(x,i){ if (x.id === id) idx = i; }); if (idx < 0) return;
  var removed = db.matches[idx], li = document.querySelector('li.swipe[data-id="'+id+'"]');
  db.matches.splice(idx, 1); save(); swOpen = null;
  function done(){ renderHome(); toast("削除しました", 5000, "元に戻す", function(){ db.matches.splice(Math.min(idx, db.matches.length), 0, removed); save(); if (view==="home") renderHome(); toast("元に戻しました"); }); }
  if (li && !window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    li.style.height = li.offsetHeight + "px"; li.offsetHeight; li.classList.add("gone"); li.style.height = "0px"; setTimeout(done, 230);
  } else done();
}
async function keepAwake(){ try { if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", function(){ wake=null; }); } } catch(e){ wake=null; } }
function releaseWake(){ try { if (wake) wake.release(); } catch(e){} wake=null; }
document.addEventListener("visibilitychange", function(){ if (document.visibilityState==="visible" && view==="score") keepAwake(); });
/* 試合中の画面：指が少しずれても画面がスクロール・バウンド・拡大しないようにする（結果の小窓だけは例外） */
document.addEventListener("touchmove", function(e){
  if (view === "score" && !(e.target.closest && e.target.closest(".gate"))) { if (e.cancelable) e.preventDefault(); }
  else if (e.touches && e.touches.length > 1 && view === "score") { if (e.cancelable) e.preventDefault(); }
}, { passive:false });
["gesturestart","gesturechange"].forEach(function(t){ document.addEventListener(t, function(e){ if (view === "score") e.preventDefault(); }, { passive:false }); });
document.addEventListener("touchstart", function(){}, { passive:true }); /* iPhoneでボタンを押した感触（:active）を出す */
try { if ("scrollRestoration" in history) history.scrollRestoration = "manual"; } catch(e){}

document.addEventListener("click", function(e){ /* 候補リストの外をタップしたら閉じる */
  Object.keys(SUG).forEach(function(k){ var s = $("#"+k+"-sug"); if (s && !s.hidden && !e.target.closest("#"+k+"-sug") && e.target.id !== SUG[k].input) s.hidden = true; });
});
document.addEventListener("click", function(e){
  var el = e.target.closest("[data-act]"); if (!el) return;
  var a = el.dataset.act, m = cur();
  switch(a){
    case "swipe-del": swipeDelete(el.dataset.id); break;
    case "new": editingId=null; presetMode=null; show("setup"); break;
    case "sug-pick": var sk=el.dataset.k, sin=$("#"+SUG[sk].input); sin.value = el.dataset.v; $("#"+sk+"-sug").hidden = true; break;
    case "sug-del": var dk=el.dataset.k, dh=POOL[SUG[dk].pool].hidden; if (db[dh].indexOf(el.dataset.v) === -1) db[dh].push(el.dataset.v); save(); showSug(dk, $("#"+SUG[dk].input).value.trim()); toast("候補から削除しました"); break;
    case "new-result": editingId=null; presetMode="result"; show("setup"); break;
    case "home": confirmDel=false; show("home"); break;
    case "open": curId = el.dataset.id; confirmDel=false; var mm=cur(); editingId = isReady(mm) ? mm.id : null; show(openView(mm)); break;
    case "prep": var pm = editingId ? find(editingId) : null; submitSetup(pm, false, "prep"); break;
    case "pt": point(el.dataset.side); break;
    case "undo": undo(); break;
    case "next": nextGame(); break;
    case "swap": m.swapped = !m.swapped; save(); renderScore(); break;
    case "sheet": show("sheet"); break;
    case "finish": m.status="done"; m.result={type:"normal"}; save(); show("sheet"); break;
    case "resume": m.status="playing"; m.result={type:"normal"}; m.endedAt=null; save(); show("score"); break;
    case "end-ask": endAsk=true; renderScore(); break;
    case "end-no": endAsk=false; renderScore(); break;
    case "end": endMatch(el.dataset.win || null); break;
    case "edit-pts": show("edit"); break;
    case "cell": if (view==="sheet" && el.closest("#frame")) openCell(+el.dataset.g, el.dataset.side); break;
    case "cell-step": var cv=$("#cell-v"); cv.value = Math.max(0, Math.min(99, (parseInt(cv.value,10)||0) + (+el.dataset.d))); break;
    case "cell-save": saveCell(+el.dataset.g, el.dataset.side); break;
    case "ep": var gi=+el.dataset.g, s=el.dataset.side, t=tally(m.games[gi]); setPts(gi, s, (s==="A"?t.a:t.b) + (+el.dataset.d)); break;
    case "eg-add": var pg=lastGame(m); m.games.push({ rallies:[], first: gameWinner(m,pg) || pg.first || "A", start:null, end:null, edited:true }); afterEdit(m); break;
    case "eg-del": m.games.splice(+el.dataset.g,1); if (!m.games.length) m.games.push({rallies:[],first:"A",start:null,end:null}); afterEdit(m); break;
    case "edit": editingId = m.id; show("setup"); break;
    case "cancel-edit": editingId=null; show(m && !isReady(m) ? openView(m) : "home"); break;
    case "pdf": exportFile("pdf"); break;
    case "png": exportFile("png"); break;
    case "del": confirmDel=true; renderSheet(); break;
    case "del-no": confirmDel=false; renderSheet(); break;
    case "del-yes": db.matches = db.matches.filter(function(x){ return x.id!==curId; }); curId=null; confirmDel=false; save(); toast("削除しました"); show("home"); break;
    case "close-modal": $("#modal").hidden = true; $("#modal").innerHTML=""; pendingShare = null; lockScroll(); break;
    case "share-now": if (pendingShare){ var ps = pendingShare; shareFile(ps.file).then(function(r){
        if (r === "ok"){ $("#modal").hidden = true; $("#modal").innerHTML = ""; pendingShare = null; lockScroll(); toast("共有・保存しました"); }
        else if (r === "again") toast("この画面では共有できません。下のボタンをお試しください");
      }).catch(function(){ toast("この画面では共有できません。下のボタンをお試しください"); }); } break;
    case "dl-now": if (pendingShare){ if (downloadBlob(pendingShare.blob, pendingShare.name)) toast("保存しました"); } break;
    case "img-now": if (pendingShare){ var pc = pendingShare.canvas; pendingShare = null; fallback(pc); } break;
  }
});

document.addEventListener("change", function(e){
  var el = e.target, m = cur(); if (!m || view !== "edit") return;
  if (el.classList.contains("ep")){ setPts(+el.dataset.g, el.dataset.side, el.value, true); setTimeout(renderKeepFocus, 0); }
  else if (el.name === "res"){
    var v = el.value;
    m.result = v==="normal" ? {type:"normal"} : v==="stop" ? {type:"stopped", winner:null} : {type:"retired", winner:v.slice(4)};
    afterEdit(m);
  }
});
document.addEventListener("focusin", function(e){ /* 数字欄をタップしたら中身を選択（0を消さずに上書きできる） */
  var el = e.target; if (el && el.classList && (el.classList.contains("ep") || el.id === "cell-v")) setTimeout(function(){ try { el.select(); } catch(_){} }, 0);
});
function endMatch(win){
  var m = cur(), now = Date.now(), g = lastGame(m);
  if (g.rallies.length){ if (!g.end) g.end = now; } else if (m.games.length > 1) m.games.pop();
  m.result = win ? {type:"retired", winner:win} : {type:"stopped", winner:null};
  m.status = "done"; m.endedAt = now; if (!m.startedAt) m.startedAt = now;
  endAsk = false; save(); toast("試合を終了しました"); show("sheet");
}

try { history.replaceState({ rn:"home" }, ""); } catch(e){}
show("home", true);
})();
</script>
